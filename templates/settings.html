
<!DOCTYPE html>
<html>
<head>
    <title>Settings - CampusFind AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #F4F7F2;
            margin: 0;
            padding: 0;
        }

        .settings-container {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
            padding: 30px;
            background: #91B394;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: #173D20;
        }

        .setting-btn {
            display: block;
            background: #E8F0E6;
            color: #173D20;
            padding: 18px;
            margin: 18px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        .setting-btn:hover {
            background: #D1E3D0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #173D20;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="settings-container">

        <h1>CampusFind AI</h1>
        <h2>Settings</h2>

        <a href="/messages" class="setting-btn">
            💬 Contact Finder
        </a>

        <a href="/share-location" class="setting-btn">
            📍 Share Item Location
        </a>

        <a href="/profile" class="setting-btn">
            👤 User Profile
        </a>

        <a href="/logout" class="setting-btn">
            🚪 Logout
        </a>

        <a href="/home" class="back-btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
